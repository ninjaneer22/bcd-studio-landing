  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #E8EAED;
      margin: 0;
      overflow-x: hidden;
    }

    canvas {
      display: block;
    }

    .text-gradient {
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Custom Shimmer Animation for Button Rims */
    @keyframes shimmer {
      0% {
        transform: translateX(-150%) skewX(-20deg);
      }

      100% {
        transform: translateX(150%) skewX(-20deg);
      }
    }

    /* Thin, dark scrollbar */
    html {
      scrollbar-width: thin;
      scrollbar-color: #3a3a40 #0a0a0a;
    }

    html::-webkit-scrollbar {
      width: 8px;
    }

    html::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    html::-webkit-scrollbar-thumb {
      background: #3a3a40;
      border-radius: 4px;
    }

    html::-webkit-scrollbar-thumb:hover {
      background: #55555c;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'google-white': '#E8EAED',
            'google-grey': '#9AA0A6',
            'google-dark': '#202124',
          },
          animation: {
            'shimmer': 'shimmer 2.5s infinite linear',
          }
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {

    "gsap": "https://esm.sh/gsap@^3.14.2",
    "gsap/": "https://esm.sh/gsap@^3.14.2/",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@^3.14.2/ScrollTrigger",
    "gsap/ScrollToPlugin": "https://esm.sh/gsap@^3.14.2/ScrollToPlugin"
  }
}
</script>
